  openai:
    label: "OpenAI (ChatGPT)"
    protocol: openai_responses
    auth_mode: chatgpt_oauth
    base_url: "https://api.openai.com/v1"
    env_key: OPENAI_API_KEY
    default_model: gpt-5.4
    thinking_mode: toggleable
