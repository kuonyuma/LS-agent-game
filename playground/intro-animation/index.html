            ctx.stroke();

            if (ch.reformP > 0.01 && ch.convergeP < 0.96) {
              const energy = ch.reformP * (1 - ch.convergeP * 0.55);
              const g = ctx.createLinearGradient(-rx, 0, rx, 0);
              g.addColorStop(0, `rgba(66,133,244,${0.55 * energy})`);
              g.addColorStop(0.35, `rgba(124,58,237,${0.62 * energy})`);
              g.addColorStop(0.7, `rgba(217,119,87,${0.55 * energy})`);
              g.addColorStop(1, `rgba(20,184,166,${0.55 * energy})`);
              ctx.strokeStyle = g;
              ctx.lineWidth = 2.6 * energy;
              ctx.beginPath();
              ctx.ellipse(0, 0, rx, ry, 0, 0, TAU);
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        // 4) 紧贴卡片下缘的柔和接触投影与环境溢色倒影
        for (let i = 0; i < COUNT; i++) {
          const n = cardNodes[i];
          if (n.opacity < 0.06) continue;
          const cardBottomY = n.screenY + (cardH * n.scale) * 0.5;
          const shadowGap = lerp(14, 24, n.depthNorm) * (1 + n.focus * 0.35);
          const shY = cardBottomY + shadowGap;
          const shW = cardW * n.scale * 0.46;
          const shH = Math.max(7, cardH * n.scale * 0.11);
          const shAlpha = n.opacity * lerp(0.06, 0.16, n.depthNorm) * (1 + n.focus * 0.25);

          ctx.save();
          ctx.translate(n.screenX, shY);
          ctx.scale(1, shH / Math.max(shW, 1));
          const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, shW);
          rg.addColorStop(0, `rgba(15, 23, 42, ${(shAlpha * 0.72).toFixed(4)})`);
          rg.addColorStop(0.45, rgba(n.vendor.primary, shAlpha * 0.52));
          rg.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = rg;
          ctx.beginPath();
          ctx.arc(0, 0, shW, 0, TAU);
          ctx.fill();
          ctx.restore();
        }

        // 5) 9 道向心阿基米德螺线彗星能量臂
        if (ch.convergeP > 0.02 && ch.bloomP < 0.96) {
          const trailStrength = Math.sin(clamp(ch.convergeP) * Math.PI) * (1 - ch.bloomP * 0.65);
          const cosRoll = Math.cos(ch.rollTilt);
          const sinRoll = Math.sin(ch.rollTilt);
          const sinPitch = Math.sin(ch.pitchTilt);

          ctx.save();
          ctx.lineCap = "round";
          for (let i = 0; i < COUNT; i++) {
            const v = VENDORS[i];
            const samples = 24;
            const pts = [];
            for (let s = 0; s <= samples; s++) {
              const back = s * 0.026;
              const pS = clamp(ch.convergeP - back);
              const rS = ringRadius * (1 - easeInOutQuart(pS));
              const yawS = ch.ringYaw + (Math.pow(ch.convergeP, 1.75) - Math.pow(pS, 1.75)) * 4.8 + i * (TAU / COUNT);
              const ox = Math.cos(yawS) * rS;
              const oy = Math.sin(yawS) * rS * sinPitch;
              pts.push({
                x: cx + ox * cosRoll - oy * sinRoll,
                y: cy + ox * sinRoll + oy * cosRoll,
              });
            }
            if (pts.length >= 2) {
              const head = pts[0];
              const tail = pts[pts.length - 1];
              const tg = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
              tg.addColorStop(0, rgba(v.primary, 0.88 * trailStrength));
              tg.addColorStop(0.5, rgba(v.secondary, 0.45 * trailStrength));
              tg.addColorStop(1, rgba(v.accent, 0));

              ctx.strokeStyle = tg;
              ctx.lineWidth = 3.6 * trailStrength + 0.8;
              ctx.beginPath();
              ctx.moveTo(pts[0].x, pts[0].y);
              for (let s = 1; s < pts.length; s++) ctx.lineTo(pts[s].x, pts[s].y);
              ctx.stroke();

              ctx.beginPath();
              ctx.arc(head.x, head.y, 3.8 * trailStrength, 0, TAU);
              ctx.fillStyle = rgba(v.primary, 0.92 * trailStrength);
              ctx.fill();
            }
          }
          ctx.restore();
        }

        // 6) 中心 9 合 1 融合脉冲（直接演化成中心光学呼吸光舱）
        if (ch.convergeP > 0.52 && ch.bloomP < 1) {
          const peak = smoothstep(0.52, 0.98, ch.convergeP) * (1 - smoothstep(0.18, 0.96, ch.bloomP));
          const coreR = Math.min(width, height) * (0.05 + ch.bloomP * 0.36);

          const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
          cg.addColorStop(0, `rgba(255, 255, 255, ${0.98 * peak})`);
          cg.addColorStop(0.24, `rgba(124, 58, 237, ${0.52 * peak})`);
          cg.addColorStop(0.58, `rgba(59, 130, 246, ${0.24 * peak})`);
          cg.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = cg;
          ctx.beginPath();
          ctx.arc(cx, cy, coreR, 0, TAU);
          ctx.fill();

          if (ch.bloomP > 0.01) {
            const waveR = Math.min(width, height) * (0.06 + easeOutCubic(ch.bloomP) * 0.44);
            ctx.strokeStyle = `rgba(124, 58, 237, ${(1 - ch.bloomP) * 0.52})`;
            ctx.lineWidth = 2.4 * (1 - ch.bloomP * 0.55);
            ctx.beginPath();
            ctx.arc(cx, cy, waveR, 0, TAU);
            ctx.stroke();
          }
        }

        // 7) 智启 Agent 同源倾斜粒子星环（-0.16 rad）
        //    终态下与 9 枚厂商行星发生真实物理微引力交互：68px 内粒子自动按该家配色染色并如水流般分流绕行！
        const particleVisibility = lerp(0.32, 1.0, ch.bloomP);
        const tilt = ch.rollTilt;
        const tiltCos = Math.cos(tilt);
        const tiltSin = Math.sin(tilt);
        const fieldRx = width * 0.38;
        const fieldRy = Math.min(height * 0.32, Math.max(132, fieldRx * 0.54));
        const breathing = Math.sin(ambientTime * 1.48) * 0.045 + Math.sin(ambientTime * 2.55) * 0.016;
        const ringRad = lerp(0.55, 1.0, easeOutBack(ch.bloomP, 0.7)) * (1 + breathing);
        const arcPhase = 1.33 + Math.sin(ambientTime * 0.27) * 0.44;
        const fx = follow.x * 0.075 + Math.sin(ambientTime * 0.47) * 0.032;
        const fy = follow.y * 0.075 + Math.sin(ambientTime * 0.63) * 0.025;

        const fieldMode = spotlightIdx >= 0 ? VENDORS[spotlightIdx].fieldMode : "none";
        const modeAmp = ch.anyFocus;

        if (ch.bloomP > 0.05) {
          ctx.save();
          ctx.translate(cx + fx * fieldRx, cy + fy * fieldRy);
          ctx.rotate(tilt);
          ctx.scale(fieldRx * 1.28, fieldRy * 1.30);
          const halo = ctx.createRadialGradient(-0.1, 0.1, 0, 0, 0, 1);
          halo.addColorStop(0, rgba(curAccent, 0.095 * ch.bloomP));
          halo.addColorStop(0.58, rgba(curTint, 0.115 * ch.bloomP));
          halo.addColorStop(1, rgba(curTint, 0));
          ctx.fillStyle = halo;
          ctx.fillRect(-1, -1, 2, 2);
          ctx.restore();
        }

        const wakeActive = ch.finaleP > 0.02 && finaleBadges && finaleBadges.length === COUNT;
        const wakeRadius = 74;

        ctx.save();
        ctx.lineCap = "round";

        for (let i = 0; i < PARTICLES.length; i++) {
          const p = PARTICLES[i];
          const x = p.x + Math.sin(ambientTime * 0.92 + p.phase) * 0.018;
          const y = p.y + Math.cos(ambientTime * 0.78 + p.phase) * 0.022;
          const lx = x - fx;
          const ly = y - fy;
          const ang = Math.atan2(ly, lx);
          const dist = Math.hypot(lx, ly);
          const offset = dist - ringRad + Math.sin(ang * 4 + ambientTime) * 0.022;

          const broad = Math.exp(-(((offset + 0.034) / 0.145) ** 2));
          const rim = Math.exp(-((offset / 0.058) ** 2));
          const arc = 0.56 + 0.44 * (0.5 + 0.5 * Math.cos(ang * 2 + arcPhase)) ** 2;
          const band = broad * 0.42 + rim * 0.58;
          const strength = band * arc;

          let highlight = 0;
          let radialAdj = 0;
          if (modeAmp > 0.05) {
            if (fieldMode === "glint") {
              const gAng = -2.8 + ((ambientTime * 1.4) % TAU);
              highlight = band * arcLight(ang, gAng, 0.36) * modeAmp;
            } else if (fieldMode === "align") {
              const al = arcLight(ang, 1.9, 0.9) * Math.sqrt(band) * modeAmp;
              highlight = al * 0.58;
              radialAdj = al * (ringRad - dist) * 0.8;
            } else if (fieldMode === "double_arc") {
              const sec = arcLight(ang, -1.05, 0.85) * Math.exp(-(((offset - 0.16) / 0.06) ** 2)) * modeAmp;
              highlight = sec * 0.72;
              radialAdj = sec * (ringRad + 0.16 - dist) * 0.75;
            } else if (fieldMode === "slash") {
              const slashAng = -Math.PI / 4;
              highlight = band * (arcLight(ang, slashAng, 0.28) + arcLight(ang, slashAng + Math.PI, 0.28)) * 0.75 * modeAmp;
            } else {
              highlight = band * arcLight(ang, ambientTime * 0.9, 0.6) * 0.48 * modeAmp;
            }
          }

          const alignScale = 1 + radialAdj / Math.max(dist, 0.01);
          const px = (fx + lx * alignScale) * fieldRx;
          const py = (fy + ly * alignScale) * fieldRy;
          let sx = cx + px * tiltCos - py * tiltSin;
          let sy = cy + px * tiltSin + py * tiltCos;

          // 检测粒子是否落入 9 颗行星的物理微引力场（60~74px 内流体绕流 + 专属色局部染色）
          let wakeWeight = 0;
          let wakeRgb = null;
          let wakeDir = null;
          if (wakeActive) {
            let bestW = 0;
            let bestB = null;
            let bestDx = 0;
            let bestDy = 0;
            let bestD = 0;
            for (let bi = 0; bi < COUNT; bi++) {
              const b = finaleBadges[bi];
              if (b.visible < 0.05) continue;
              const dx = sx - b.sx;
              const dy = sy - b.sy;
              const d = Math.hypot(dx, dy);
              const rInf = b.isHovered || b.isSelected ? wakeRadius * 1.22 : wakeRadius;
              if (d < rInf) {
                const rawW = (1 - d / rInf) * b.visible;
                if (rawW > bestW) {
                  bestW = rawW;
                  bestB = b;
                  bestDx = dx;
                  bestDy = dy;
                  bestD = d;
                }
              }
            }

            if (bestB && bestW > 0.01) {
              const smoothW = Math.pow(bestW, 1.35);
              wakeWeight = smoothW;
              // 流体绕流排斥：像水流绕过石块一样温柔分流，避免硬切空洞，并在边缘形成丝滑流线
              const invD = 1 / Math.max(bestD, 1);
              const nx = bestDx * invD;
              const ny = bestDy * invD;
              const push = Math.sin(clamp(bestW) * Math.PI) * 15.5 * (bestB.isHovered ? 1.25 : 1);
              // 稍微顺着行星尾流方向带一点拖曳感
              sx += nx * push - bestB.tx * smoothW * 5.0;
              sy += ny * push - bestB.ty * smoothW * 5.0;

              // 粒子流线朝向向行星绕流切线偏转
              const side = bestDx * bestB.ty - bestDy * bestB.tx >= 0 ? 1 : -1;
              wakeDir = Math.atan2(bestB.ty + ny * 0.42 * side, bestB.tx + nx * 0.42 * side);

              // 按该厂商专属色板染色（Gemini 按局部角度折射四色，其他按专属主/辅色平滑渐变）
              const colorU = bestB.vendor.trail.spectrum
                ? ((Math.atan2(bestDy, bestDx) / TAU + 1) % 1)
                : clamp(1 - bestW);
              wakeRgb = sampleTrailColor(bestB.vendor.trail, colorU);
            }
          }

          if (strength < 0.055 && highlight < 0.045 && wakeWeight < 0.08 && p.seed < 0.5) continue;

          let len = 0.85 + p.seed * 0.95 + strength * 5.2 * particleVisibility + highlight * 5.0;
          if (wakeWeight > 0.01) {
            len += wakeWeight * 5.6;
          }

          let dir = Math.atan2(ly * fieldRy, lx * fieldRx) + tilt + Math.sin(p.phase + ambientTime) * 0.16;
          if (highlight > 0.04 || ch.bloomP > 0.25) {
            const tan = Math.atan2(lx * fieldRy, -ly * fieldRx) + tilt;
            const turn = tan - dir;
            const shortest = Math.atan2(Math.sin(2 * turn), Math.cos(2 * turn)) / 2;
            dir += shortest * clamp(highlight * 2.2 + ch.bloomP * 0.58);
          }
          if (wakeDir !== null) {
            const turnW = wakeDir - dir;
            const shortW = Math.atan2(Math.sin(2 * turnW), Math.cos(2 * turnW)) / 2;
            dir += shortW * clamp(wakeWeight * 1.15);
          }

          const tx = Math.cos(dir) * len * 0.5;
          const ty = Math.sin(dir) * len * 0.5;
          const alpha = clamp(
            (0.12 + strength * 0.82 + highlight * 0.64) * particleVisibility + wakeWeight * 0.44,
            0,
            0.98
          );

          const baseRgb = rim * arc > 0.34 && p.seed > 0.3 ? curAccent : curTint;
          const finalRgb = wakeRgb ? mixRgb(baseRgb, wakeRgb, clamp(wakeWeight * 1.35)) : baseRgb;

          ctx.globalAlpha = alpha;
          ctx.strokeStyle = rgba(finalRgb, 1);
          ctx.lineWidth = 0.9 + strength * 1.15 + wakeWeight * 0.85;
          ctx.beginPath();
          ctx.moveTo(sx - tx, sy - ty);
          ctx.lineTo(sx + tx, sy + ty);
          ctx.stroke();
        }
        ctx.restore();

        // 8) 9 颗行星各自的「专属配色彗星微尾迹」+ 柔和星光晕（与粒子星环浑然一体）
        if (wakeActive) {
          drawFinalePlanetTrails(ctx, cx, cy, finaleBadges);
        }
      }

      function drawFinalePlanetTrails(ctx, cx, cy, finaleBadges) {
        ctx.save();
        ctx.lineCap = "round";

        for (let i = 0; i < COUNT; i++) {
          const b = finaleBadges[i];
          if (b.visible <= 0.02) continue;

          const trail = b.vendor.trail;
          const boost = b.isHovered || b.isSelected ? 1.32 : 1.0;
          const depthAlpha = lerp(0.72, 1.0, b.depth) * b.visible;
          // 尾迹弧度：平时优雅细腻（0.34 rad），拖拽/滚轮甩动时顺着惯性自然拉长！
          const arcSpan = (0.34 + b.speedExtra) * (b.isHovered ? 1.18 : 1.0);
          const segs = 22;

          // (A) 沿倾斜椭圆轨道绘制专属配色渐隐彗星光带（支持 Gemini 四色虹彩平滑过渡！）
          const pts = [];
          for (let s = 0; s <= segs; s++) {
            const u = s / segs; // 0=行星中心, 1=尾迹末端
            const a = b.angle - b.dirSign * u * arcSpan;
            const lx = Math.cos(a) * b.fieldRx * 1.03;
            const ly = Math.sin(a) * b.fieldRy * 1.03;
            pts.push({
              x: cx + b.fx + lx * b.cosT - ly * b.sinT,
              y: cy + b.fy + lx * b.sinT + ly * b.cosT,
              u,
            });
          }

          // 外层极柔和彩色光晕宽尾（让行星像在星河里滑过留下一道柔光水痕）
          for (let s = 0; s < segs; s++) {
            const p0 = pts[s];
            const p1 = pts[s + 1];
            const uMid = (p0.u + p1.u) * 0.5;
            const fade = Math.pow(1 - uMid, 1.9);
            const col = sampleTrailColor(trail, uMid);

            ctx.strokeStyle = rgba(col, 0.16 * fade * depthAlpha * boost);
            ctx.lineWidth = (11.5 * (1 - uMid * 0.72)) * lerp(0.85, 1.08, b.depth);
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();

            // 内核精致亮丝彗尾
            ctx.strokeStyle = rgba(col, 0.58 * fade * depthAlpha * boost);
            ctx.lineWidth = (2.5 * (1 - uMid * 0.78)) * lerp(0.88, 1.12, b.depth);
            ctx.beginPath();
            ctx.moveTo(p0.x, p0.y);
            ctx.lineTo(p1.x, p1.y);
            ctx.stroke();
          }

          // (B) 沿尾迹飘散的 16 颗细腻专属色星尘微丝（自然微漂移 + 越往后越轻盈消散）
          for (let m = 0; m < TRAIL_MOTES.length; m++) {
            const mote = TRAIL_MOTES[m];
            // 星尘在尾迹里顺着公转缓缓向后流逝循环
            const u = (mote.u + ambientTime * 0.28) % 1;
            const a = b.angle - b.dirSign * (0.04 + u * arcSpan * 1.18);
            const lx = Math.cos(a) * b.fieldRx * 1.03;
            const ly = Math.sin(a) * b.fieldRy * 1.03;
            const bx = cx + b.fx + lx * b.cosT - ly * b.sinT;
            const by = cy + b.fy + lx * b.sinT + ly * b.cosT;

            // 切线与法线方向
            const dlx = -Math.sin(a) * b.fieldRx * 1.03 * b.dirSign;
            const dly = Math.cos(a) * b.fieldRy * 1.03 * b.dirSign;
            const tx0 = dlx * b.cosT - dly * b.sinT;
            const ty0 = dlx * b.sinT + dly * b.cosT;
            const tLen = Math.hypot(tx0, ty0) || 1;
            const tx = tx0 / tLen;
            const ty = ty0 / tLen;
            const nx = -ty;
            const ny = tx;

            // 越靠尾部扩散稍微更开、飘荡更柔和
            const drift = (mote.spread * (6 + u * 16)) + Math.sin(ambientTime * 2.4 + mote.phase) * 2.5 * u;
            const mx = bx + nx * drift;
            const my = by + ny * drift;
            const tailLen = (2.4 + (1 - u) * 5.2 + b.speedExtra * 8) * mote.size;
            const fade = Math.pow(1 - u, 1.35) * smoothstep(0.0, 0.12, u);
            const col = sampleTrailColor(trail, u);

            ctx.strokeStyle = rgba(col, 0.84 * fade * depthAlpha * boost);
            ctx.lineWidth = (0.95 + (1 - u) * 1.1) * mote.size;
            ctx.beginPath();
            ctx.moveTo(mx - tx * tailLen * 0.5, my - ty * tailLen * 0.5);
            ctx.lineTo(mx + tx * tailLen * 0.5, my + ty * tailLen * 0.5);
            ctx.stroke();
          }

          // (C) 行星底部柔和专属光晕（柔和衔接白圆徽章与周围星河，彻底告别硬贴纸感）
          const haloR = (b.isHovered || b.isSelected ? 48 : 38) * lerp(0.88, 1.08, b.depth);
          const hg = ctx.createRadialGradient(b.sx, b.sy, 10, b.sx, b.sy, haloR);
          hg.addColorStop(0, rgba(trail.head, 0.24 * depthAlpha * boost));
          hg.addColorStop(0.55, rgba(trail.mid, 0.10 * depthAlpha * boost));
          hg.addColorStop(1, rgba(trail.tail, 0));
          ctx.fillStyle = hg;
          ctx.beginPath();
          ctx.arc(b.sx, b.sy, haloR, 0, TAU);
          ctx.fill();
        }
        ctx.restore();
      }

      /* =====================================================================
         12. 终场正中央「纯无字呼吸光学胶囊」
             —— 与智启 Agent 输入框 Composer 形态呼应，未来无缝原地展开！
         ===================================================================== */
      function updateFinaleCore(ch) {
        const show = ch.finaleP;
        const hideForInspect = smoothstep(0.04, 0.42, clamp(ch.finaleInspectFocus));
        const vis = clamp(show * (1 - hideForInspect));

        if (vis <= 0.008) {
          finaleCoreEl.style.opacity = "0";
          return;
        }

        const pop = easeSpringOut(clamp(show));
        const sc = lerp(0.76, 1.0, pop) * lerp(1, 0.92, hideForInspect);
        const px = follow.x * 7;
        const py = follow.y * 5;
        finaleCoreEl.style.opacity = vis.toFixed(3);
        finaleCoreEl.style.transform =
          `translate(calc(-50% + ${px.toFixed(1)}px), calc(-50% + ${py.toFixed(1)}px)) scale(${sc.toFixed(4)})`;

        // 绘制胶囊内部纯无字呼吸微光（左侧光标呼吸脉动 + 底部星光渐变流轨 + 右下圆形发送箭头轮廓）
        const cw = coreCanvas.width / dpr;
        const chH = coreCanvas.height / dpr;
        const ctx = coreCtx;
        ctx.clearRect(0, 0, cw, chH);

        // (1) 左上方柔和闪烁的极简输入光标竖线（无字却瞬间传递“准备就绪、等待指令”！）
        const blink = 0.25 + 0.75 * (Math.sin(ambientTime * 3.4) * 0.5 + 0.5);
        ctx.fillStyle = `rgba(124, 58, 237, ${(0.82 * blink).toFixed(3)})`;
        roundedRectPath(ctx, 26, 22, 2.4, 18, 1.2);
        ctx.fill();

        // 极淡的抽象占位呼吸线条（像待输入的柔光呼吸条，不放任何文字）
        const barW = Math.min(cw * 0.36, 175);
        const shimmer = (Math.sin(ambientTime * 1.8) * 0.5 + 0.5) * 0.07;
        roundedRectPath(ctx, 38, 28, barW, 6, 3);
        ctx.fillStyle = `rgba(15, 23, 42, ${(0.055 + shimmer).toFixed(3)})`;
        ctx.fill();

        // (2) 左下角：呼应智启 Agent 截图里那条标志性的紫粉星光推杆（纯图形无文字！）
        const pillX = 24;
        const pillY = chH - 30;
        const pillW = Math.min(cw * 0.34, 152);
        const pillH = 14;
        const pg = ctx.createLinearGradient(pillX, 0, pillX + pillW, 0);
        pg.addColorStop(0, "#9333EA");
        pg.addColorStop(0.55, "#C026D3");
        pg.addColorStop(1, "#DB2777");
        roundedRectPath(ctx, pillX, pillY, pillW, pillH, pillH * 0.5);
        ctx.fillStyle = pg;
        ctx.fill();

        // 推杆内流动的小星光微粒
        for (let k = 0; k < 5; k++) {
          const sx = pillX + 12 + ((k * 28 + ambientTime * 22) % (pillW - 28));
          const sy = pillY + pillH * (0.35 + (k % 2) * 0.3);
          const sa = 0.4 + 0.6 * (Math.sin(ambientTime * 4 + k * 1.3) * 0.5 + 0.5);
          ctx.beginPath();
          ctx.arc(sx, sy, 1.35, 0, TAU);
          ctx.fillStyle = `rgba(255, 255, 255, ${sa.toFixed(2)})`;
          ctx.fill();
        }
        // 推杆右端发光圆环滑块
        ctx.beginPath();
        ctx.arc(pillX + pillW - 7, pillY + pillH * 0.5, 4.5, 0, TAU);
        ctx.fillStyle = "#FFFFFF";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(pillX + pillW - 7, pillY + pillH * 0.5, 2.0, 0, TAU);
        ctx.fillStyle = "#C026D3";
        ctx.fill();

        // (3) 右下角：极简圆形上箭头触发徽记
        const ax = cw - 30;
        const ay = chH - 23;
        ctx.beginPath();
        ctx.arc(ax, ay, 13, 0, TAU);
        ctx.fillStyle = "rgba(15, 23, 42, 0.065)";
        ctx.fill();
        ctx.strokeStyle = "rgba(15, 23, 42, 0.38)";
        ctx.lineWidth = 1.6;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(ax, ay + 4.5);
        ctx.lineTo(ax, ay - 4.5);
        ctx.moveTo(ax - 3.8, ay - 0.8);
        ctx.lineTo(ax, ay - 4.5);
        ctx.lineTo(ax + 3.8, ay - 0.8);
        ctx.stroke();

        // 顶部柔和流光边掠过
        const sweepX = ((ambientTime * 95) % (cw + 180)) - 90;
        const sg = ctx.createLinearGradient(sweepX - 70, 0, sweepX + 70, 0);
        sg.addColorStop(0, "rgba(124, 58, 237, 0)");
        sg.addColorStop(0.5, "rgba(192, 38, 211, 0.28)");
        sg.addColorStop(1, "rgba(124, 58, 237, 0)");
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, cw, 2);
      }

      /* =====================================================================
         13. 终态星环外缘 9 枚带 3D 纵深感的可交互微缩徽章（复用实时坐标，与尾迹 0 延迟对齐）
         ===================================================================== */
      function updateFinaleOrbitBadges(ch, finaleBadges) {
        const show = ch.finaleP;
        for (let i = 0; i < COUNT; i++) {
          const b = badgeNodes[i];
          const st = finaleBadges[i];
          if (show <= 0.01) {
            b.el.style.opacity = "0";
            b.el.style.pointerEvents = "none";
            continue;
          }
          const depthScale = lerp(0.86, 1.09, st.depth);
          const depthAlpha = lerp(0.84, 1.0, st.depth);
          const emphasisScale = st.isSelected ? 1.18 : st.isHovered ? 1.12 : 1.0;

          b.el.style.opacity = (st.visible * depthAlpha).toFixed(3);
          b.el.style.zIndex = String(24 + Math.round(st.depth * 10));
          b.el.style.pointerEvents = st.stagger > 0.4 ? "auto" : "none";
          b.el.style.transform =
            `translate3d(${(st.sx - 24).toFixed(2)}px, ${(st.sy - 24).toFixed(2)}px, 0) ` +
            `scale(${(clamp(st.stagger, 0, 1.15) * depthScale * emphasisScale).toFixed(3)})`;
          b.el.style.borderColor = st.isSelected || st.isHovered
            ? rgba(st.vendor.trail.head, 0.78)
            : rgba(st.vendor.trail.head, 0.24);
          b.el.style.boxShadow = st.isSelected || st.isHovered
            ? `0 0 0 1.5px ${rgba(st.vendor.trail.head, 0.45)}, 0 14px 32px -6px ${rgba(st.vendor.trail.head, 0.34)}`
            : `0 0 0 1px ${rgba(st.vendor.trail.head, 0.14)}, 0 10px 24px -8px ${rgba(st.vendor.trail.head, 0.24)}`;
        }
      }

      window.requestAnimationFrame(render);
    })();
  </script>
